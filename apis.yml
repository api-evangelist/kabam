name: Kabam
description: Kabam is a mobile game developer and publisher founded in 2006 and headquartered
  in Vancouver, Canada, operating as a wholly owned subsidiary of Netmarble. The studio
  builds free-to-play multiplayer titles for iOS and Android, best known for Marvel
  Contest of Champions, alongside Shop Titans, Transformers Forged to Fight, King Arthur
  Legends, and past titles such as Disney Mirrorverse and Fast & Furious games. Kabam
  operates studios and offices across Vancouver, Montreal, Charlottetown, Los Angeles,
  San Francisco, Austin, and Seoul. Kabam publishes no public developer program, API
  reference, or SDK surface; this profile captures its public web, legal, and support
  properties plus a live domain-security probe.
